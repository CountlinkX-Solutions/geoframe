name: CI

on:
  push:
    branches: [main]
  # Any base branch, so stacked PRs (feature-branch chains) get CI too.
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  elixir:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.19"
            otp: "28"
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: geoframe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `priv/native` goes with `_build`: `_build/*/lib/geoframe/priv` is a symlink to the
      # project's `priv`, where Rustler copies the NIF. Rustler only runs when Mix recompiles
      # `GeoFrame.Native`, so a restored `_build` that is already up to date would otherwise
      # leave the NIF missing (CI on main for 3d83621).
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/native
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      # Only enforce style on the newest pair; older formatters disagree.
      - name: Check formatting
        if: matrix.elixir == '1.19'
        run: mix format --check-formatted

      - run: mix compile --warnings-as-errors

      - name: Credo
        if: matrix.elixir == '1.19'
        run: mix credo --strict

      - run: mix test

      # Broken references and missing modules in the docs fail the build.
      - name: Docs
        if: matrix.elixir == '1.19'
        run: mix docs --warnings-as-errors

      - name: PostGIS tests
        env:
          GEOFRAME_POSTGIS_URL: postgres://postgres:geoframe@127.0.0.1:5432/postgres
        run: mix test --only postgis

      # The next two steps build Explorer again in a fresh build directory, and fetching its
      # precompiled NIF with :httpc fails on GitHub's long redirect headers (header_too_long).
      # Prefetch it into the rustler_precompiled cache with curl; the checksum is still verified.
      - name: Prefetch Explorer's precompiled NIF
        if: matrix.elixir == '1.19'
        run: |
          version=$(sed -n 's/.*"explorer": {:hex, :explorer, "\([0-9.]*\)".*/\1/p' mix.lock)
          nif="libexplorer-v${version}-nif-2.15-x86_64-unknown-linux-gnu.so.tar.gz"
          cache="$HOME/.cache/rustler_precompiled/precompiled_nifs"
          mkdir -p "$cache"
          curl -fsSL --retry 5 -o "$cache/$nif" \
            "https://github.com/elixir-nx/explorer/releases/download/v${version}/${nif}"

      # Compiles GeoFrame as a user without the optional dependencies (kino, maplibre,
      # kino_maplibre, postgrex) gets it, where a call into one of them must not warn. A separate
      # build path is needed: Mix still loads the optional dependencies already compiled into
      # `_build/test`, even with `--no-optional-deps`. `--force` recompiles every file, so a
      # cached build cannot hide a warning.
      - name: Compile without optional dependencies
        if: matrix.elixir == '1.19'
        env:
          MIX_BUILD_PATH: _build/no_optional_deps
        run: mix compile --no-optional-deps --warnings-as-errors --force

      # Runs the code cells of every notebook against this checkout (Mix.install with a path
      # dependency, so the NIF is built once more in Mix.install's own directory, debug mode).
      # Guards against regressions that only show in a fresh install, such as the optional
      # postgrex compile break (#95). The notebooks download Natural Earth data over the network;
      # compare.livemd also installs GeoPandas through Pythonx (uv) and checks GeoFrame against it.
      - name: Notebooks
        if: matrix.elixir == '1.19'
        timeout-minutes: 30
        env:
          MIX_ENV: dev
        run: |
          for notebook in deck tour spike compare; do
            elixir scripts/run_livemd.exs "notebooks/${notebook}.livemd"
          done

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
