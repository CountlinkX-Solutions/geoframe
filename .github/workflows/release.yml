name: Precompiled NIFs

# Builds the `geoframe_native` NIF for every target GeoFrame.Native lists and, on a `v*` tag,
# attaches the archives to the GitHub release of that tag. `workflow_dispatch` and
# `pull_request` (only when the release setup changes) just upload workflow artifacts: a dry
# run, nothing is published.
#
# Keep `matrix.job.target` and `matrix.nif` in sync with `targets` and `nif_versions` in
# lib/geo_frame/native.ex.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".cargo/config.toml"
      - "native/geoframe_native/Cargo.toml"

permissions:
  contents: read

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}

    # Needed to attach archives to the release.
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        job:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-gnu, os: windows-2025 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
          - { target: x86_64-unknown-freebsd, os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, use-cross: true }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      - name: Read the project version from mix.exs
        shell: bash
        run: |
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> "$GITHUB_ENV"

      # The archive name embeds the mix.exs version, and GeoFrame.Native downloads it from the
      # release of `v<version>`: a mismatched tag would publish files nothing can find.
      - name: Check the tag matches mix.exs
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${PROJECT_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mix.exs version ${PROJECT_VERSION}"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        shell: bash
        run: rustup target add ${{ matrix.job.target }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          prefix-key: v0-precomp
          shared-key: ${{ matrix.job.target }}-${{ matrix.nif }}

      # project-dir is the workspace root, not native/geoframe_native: the action looks for
      # `target/<target>/release` relative to project-dir, and in a Cargo workspace that
      # directory is at the root. `-p geoframe_native` builds only the NIF crate.
      # The action then archives only `libgeoframe_native.<ext>` (it copies the library it
      # names from `project-name`), so `proj4rs.so` is never packaged.
      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.5
        with:
          project-name: geoframe_native
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          cross-version: v0.2.5
          project-dir: "./"
          cargo-args: "-p geoframe_native"

      # Fail the job if the archive holds anything but the NIF library.
      - name: Check the archive contents
        shell: bash
        run: |
          entries=$(tar -tzf "${{ steps.build-crate.outputs.file-path }}")
          echo "$entries"
          if [ "$(echo "$entries" | wc -l)" -ne 1 ] || ! echo "$entries" | grep -q 'geoframe_native-v'; then
            echo "::error::Archive must contain exactly one geoframe_native library"
            exit 1
          fi

      - name: Artifact upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      # Creates the release for the tag when it does not exist yet, otherwise attaches the
      # files to the existing one (for example one made with `gh release create`).
      - name: Publish archives to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.4
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.build-crate.outputs.file-path }}
