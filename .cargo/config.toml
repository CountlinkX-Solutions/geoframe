# cdylib on musl needs a dynamic C runtime; see https://github.com/rust-lang/rust/issues/59302
# Applies to precompiled musl NIFs (release workflow) and to source builds on musl (Alpine).
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]
