[package]
name = "geoframe_core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
arrow-array = "59"
arrow-ipc = "59"
arrow-schema = "59"
arrow-select = "59"
geo = "0.33"
geo-traits = "0.3"
geojson = "1"
geoarrow-array = "0.9"
geoarrow-expr-geo = "0.9"
geoarrow-schema = "0.9"
geoparquet = "0.9"
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "brotli", "lz4", "zstd", "flate2-rust_backend"] }
serde_json = "1"
rstar = "0.12"
wkb = "0.9"
wkt = "0.14"
proj4rs = { version = "0.2.1", default-features = false }
crs-definitions = "0.6.0"

[dev-dependencies]
tempfile = "3"
