[package]
name = "geoframe_core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
arrow-array = "60"
arrow-cast = "59"
arrow-ipc = { version = "59", features = ["lz4", "zstd"] }
arrow-schema = "59"
arrow-select = "59"
geo = "0.33"
geo-traits = "0.3"
geojson = "1"
geoarrow-array = "0.9"
geoarrow-expr-geo = "0.9"
geoarrow-schema = "0.9"
geoparquet = "0.9"
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "brotli", "lz4", "zstd", "flate2-rust_backend"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rstar = "0.12"
wkb = "0.9"
wkt = "0.14"
proj4rs = { version = "0.2.1", default-features = false, features = ["tiff", "aeqd"] }
earcut = "0.4"
crs-definitions = "0.6.0"
# Inflates the supplementary EPSG table (already in the tree through zip and parquet).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
flatgeobuf = { version = "6.0.1", default-features = false }
# Same version as flatgeobuf uses: features are rebuilt without a geometry (flatgeobuf_nulls.rs).
flatbuffers = "24.12.23"
geozero = { version = "0.15.1", default-features = false, features = ["with-geo"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
shapefile = { version = "0.9", features = ["geo-types"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }

[dev-dependencies]
tempfile = "3"
